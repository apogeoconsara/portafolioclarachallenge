<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const J = v => esc(JSON.stringify(v, null, 2));
const tag = (t, cls = "") => `<span class="tag ${cls}">${esc(t)}</span>`;
const ACTION_CLS = { contact: "good", handoff_ae: "acc", suppress: "bad", escalate_human: "warn", wait: "", enrich: "acc", update_state: "", no_action: "" };
const act = a => a ? tag(a, ACTION_CLS[a] || "") : tag("no action (intake)");
const DATA = {};
async function load(name) { if (!DATA[name]) DATA[name] = await (await fetch(`data/${name}.json`)).json(); return DATA[name]; }

// ---------------------------------------------------------------------------------------------------------------
const VIEWS = {
  async overview() {
    const [ov, runs, stream, ev, ap, ms, rp] = await Promise.all([load("overview"), load("runs"), load("stream"), load("evals"), load("approvals"), load("measurement"), load("replay")]);
    const aps = apStats(ap);
    const n = runs.scenarios.length, A = outcomeActions(ov), hm = hoursModel(ov);
    const B = { auto: A.contact + (A.nurture || 0) + A.wait + A.enrich, people: A.handoff_ae + A.escalate_human, blocked: A.suppress };
    const passed = runs.scenarios.filter(s => s.results.every((r, i) => matches(r, s.expected[i]).ok)).length;
    return `
      <h1>Command Center</h1><div class="eyebrow" style="margin:-2px 0 8px">Growth Orchestration System</div>
      <p class="lede">Clara has tens of thousands of companies it could talk to. Deciding <b>who</b> to contact, <b>what</b> to say and <b>when</b>
      is slow work that people repeat account by account. This system does it automatically and safely, and leaves people only the cases that need judgment.</p>
      <div class="banner">Everything here uses synthetic companies. Emails are only prepared and recorded in a simulated log: <b>nothing is ever sent</b>.</div>
      <h2 style="margin-top:6px">What this means for the team</h2>
      <div class="card">
        <div class="runbar"><button class="btn" id="rmGo" disabled>Running…</button><span class="rmclock" id="rmClock">${fmt(rp.total_events)} events</span></div>
        <div class="rmprog"><i id="rmProg"></i></div>
        <div class="impact"><div id="rbA" style="width:${100 * B.auto / ov.n_accounts}%;background:var(--good)"></div><div id="rbP" style="width:${100 * B.people / ov.n_accounts}%;background:var(--warn)"></div><div id="rbB" style="width:${100 * B.blocked / ov.n_accounts}%;background:var(--bad)"></div></div>
        <div class="grid g3">
          <div><div class="impact-num" id="rnA" style="color:var(--good)">${fmt(B.auto)}</div><b>Decided and prepared automatically (<span id="rpA">${(100 * B.auto / ov.n_accounts).toFixed(0)}</span>%)</b>
            <div class="d"><b>Nothing has been sent.</b> The system decides and prepares; sending is a separate step that needs human approval. ${fmt(A.contact)} outreach emails prepared automatically${A.contact === ap.total_prepared ? ` (${fmt(ap.by_step["1"])} first emails and ${fmt(ap.follow_ups)} follow-ups)` : ""}, pending human approval before sending. Also ${fmt(A.nurture || 0)} enrolled in nurture, ${fmt(A.wait)} on hold, ${fmt(A.enrich)} data lookups.</div></div>
          <div><div class="impact-num" id="rnP" style="color:var(--warn)">${fmt(B.people)}</div><b>Needs a person (<span id="rpP">${(100 * B.people / ov.n_accounts).toFixed(0)}</span>%)</b>
            <div class="d">${fmt(A.handoff_ae)} go to a sales exec and ${fmt(A.escalate_human)} need a reviewer: conflicting records, former customers, duplicates.</div></div>
          <div><div class="impact-num" id="rnB" style="color:var(--bad)">${fmt(B.blocked)}</div><b>Blocked (<span id="rpB">${(100 * B.blocked / ov.n_accounts).toFixed(0)}</span>%)</b>
            <div class="d">Should not be contacted at all: customers, opt-outs, open deals, competitors, poor fit. The system stops them before anyone wastes time.</div></div>
        </div>
        <div class="rmevs"><div><b id="evN">${fmt(rp.total_events)}</b>events processed</div><div><b id="evD">0</b>duplicates ignored</div><div><b id="evR">0</b>retried safely</div><div><b id="evX">0</b>dead letters</div></div>
        <div class="d" style="margin-top:8px">${esc(rp.label)}</div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b>~${fmt(hm.saved)} working hours potentially freed</b> (about ${hm.months.toFixed(1)} people-months, around USD ${fmt(hm.usd)}).
          People still spend ~${fmt(hm.still)} hours on the cases above that need judgment. <span class="d">Simulated: minutes per task are my assumptions. <a href="#automation" data-go="automation">Change them</a>.</span>
          <div class="d" style="margin-top:6px">Approval queue: ${aps.a} approved, ${aps.r} rejected and ${aps.p} pending in the batch of ${ap.batch} drafts. <a href="#approvals" data-go="approvals">Open the queue</a></div></div>
      </div>
      <h2>How it works</h2>
      <div class="grid g4 steps">
        <div class="card"><div class="n">1</div><h3>Something happens</h3>A company is added to a list, replies, unsubscribes or books a meeting. Each event updates what the system knows.</div>
        <div class="card"><div class="n">2</div><h3>Rules check</h3>Is it safe and sensible to contact? Customers, opt-outs, open deals and recent emails are all caught here. No AI involved.</div>
        <div class="card"><div class="n">3</div><h3>AI helps where words matter</h3>It reads replies and drafts a personal opening line, only from verified facts. Its answers are checked before anything uses them.</div>
        <div class="card"><div class="n">4</div><h3>Prepare and record</h3>The system prepares the outreach, books the next step or hands the account to a person. Anything that goes out to a customer waits for human approval. Every step is written to an audit trail.</div>
      </div>
      <p class="lede" style="margin-top:12px"><b>The model suggests, the rules decide.</b> The AI never picks the action, the sales exec or who can be emailed.</p>
      <h2>What happened to the ${fmt(ov.n_accounts)} companies</h2>
      <div class="card">${ACTION_ORDER.map(k => bar(ov.plain.actions[k][0], A[k] || 0, ov.n_accounts, ACTION_BAR[k], ov.plain.actions[k][1])).join("")}</div>
      <h2>Measuring impact</h2>
      <p class="lede" style="margin-bottom:10px">We want to know one thing: <b>does the system create more qualified sales pipeline than today's process?</b> Not more messages. Not more replies. Press play to see how we would find out.</p>
      <div class="banner warn">${esc(ms.label)} The pacing of the replay is illustrative; the final numbers are the simulation's.</div>
      <div class="card" id="miPlay">
        <div class="mi-stepper" id="miStepper"><span>1 · Split at random</span><span>2 · Run for ${ms.design.weeks} weeks</span><span>3 · Wait ${ms.design.attribution_days} days</span><span>4 · Compare</span></div>
        <p class="mi-say" id="miSay"></p>
        <div class="mi-arena" id="miArena" aria-hidden="true">
          <div class="mi-glab" id="miGA" style="left:2%"><b>Group A: today's process</b>People research, write and send by hand</div>
          <div class="mi-glab" id="miGB" style="left:52%"><b>Group B: the system</b>Rules decide, AI helps, people approve</div>
        </div>
        <div class="mi-clock"><div class="bar2"><i id="miBar"></i></div><div class="t" id="miClock">Day 0</div></div>
        <div class="mi-cols">
          <div class="mi-cnt a"><h4>Group A · per 1,000 companies</h4>
            <div class="row"><span>Companies contacted</span><b id="mi_a_c">0</b></div><div class="row"><span>Replies</span><b id="mi_a_r">0</b></div><div class="row"><span>Qualified leads accepted by a sales rep</span><b id="mi_a_s">0</b></div><div class="row big"><span>Qualified pipeline</span><b id="mi_a_p">$0</b></div></div>
          <div class="mi-cnt b"><h4>Group B · per 1,000 companies</h4>
            <div class="row"><span>Companies contacted</span><b id="mi_b_c">0</b></div><div class="row"><span>Replies</span><b id="mi_b_r">0</b></div><div class="row"><span>Qualified leads accepted by a sales rep</span><b id="mi_b_s">0</b></div><div class="row big"><span>Qualified pipeline</span><b id="mi_b_p">$0</b></div></div>
        </div>
        <div class="mi-btns"><button class="mi-btn" id="miPlayBtn" type="button">&#9654; Play</button><button class="mi-btn ghost" id="miSkip" type="button">Skip to the end</button></div>
        <div class="mi-result" id="miResult">
          <h3 style="margin:12px 0 4px">Step 4 · The comparison</h3>
          <div class="mi-rbar"><span class="d">Group A</span><div class="track"><div class="fill" style="width:${100 * ms.pipeline.control / ms.pipeline.treatment}%;background:#8B97B5"></div></div><b>USD ${fmt(ms.pipeline.control)}</b></div>
          <div class="mi-rbar"><span class="d">Group B</span><div class="track"><div class="fill" style="width:100%;background:var(--accent)"></div></div><b>USD ${fmt(ms.pipeline.treatment)}</b></div>
          <p class="d" style="margin:2px 0 8px">Qualified pipeline per 1,000 companies after ${ms.design.attribution_days} days (simulated).</p>
          <div class="mi-call">In this simulation the system is ahead by about <b>USD ${fmt(Math.round(ms.pipeline.diff / 1000) * 1000)} per 1,000 companies</b>. But the real difference could be anywhere from <b>${ms.pipeline.lo < 0 ? "−" : ""}USD ${fmt(Math.abs(ms.pipeline.lo))} to +USD ${fmt(ms.pipeline.hi)}</b>${ms.pipeline.includes_zero ? ", so one month of 50,000 companies is not enough to be sure. That is why we also read early signals at week 4 and confirm at the end" : ""}.</div>

        <div class="card"><h3>What keeps it safe</h3><span class="d">We watch unsubscribes, spam complaints, bounces, emails to companies we must never contact, and unsafe AI actions. If one goes wrong, <b>group B pauses</b>.</span></div>

        <p class="d" style="margin:0 0 6px">The AI has to earn its place. A second step splits group B in two: <b>B1 without AI</b> (rules, approved template, replies read by a person) and <b>B2 with AI</b>. The AI stays only if B2 beats B1 on qualified pipeline <i>and</i> on cost per qualified lead, without breaking a guardrail. If it does not, it is switched off there and the rules keep working.</p>

        <h3 style="margin:18px 0 4px">Difference in pipeline, with its 95% interval</h3>
        ${miRange(ms.pipeline)}
        <h3 style="margin:18px 0 2px">Guardrails say what the evidence supports</h3>
        <p class="d" style="margin:0 0 6px">Each row shows group B's rate with its 95% interval against the limit (black mark). Counts are small, so a single number can mislead. Breaches pause group B.</p>
        ${miGuards(ms.guardrails)}
        <p class="d" style="margin:6px 0 0">Also required: zero unsafe AI actions, an acceptable review-queue wait, and dead letters under control.</p>
        <div class="mi-call" style="margin-top:8px">${miGuardNote(ms.guardrails)}</div>
        <h3 style="margin:18px 0 4px">Group B starts small and grows only while it is safe <span class="tag">proposed</span></h3>
        ${miRamp()}
        <p class="d" style="margin:2px 0 8px">&#9671; gate: before volume goes up, the guardrails are checked. The schedule is a design choice, not a result.</p>
        <div class="mi-steps3"><div class="mi-st go"><b>GO</b><span class="d">Every interval is below its limit: volume goes up.</span></div><div class="mi-st hold"><b>HOLD</b><span class="d">An interval touches a limit: same volume, keep measuring.</span></div><div class="mi-st stop"><b>PAUSE</b><span class="d">An interval is entirely above a limit, or the limit is broken two weeks in a row. A policy violation or an unsafe AI action pauses at once.</span></div></div>

        <div class="mi-brake"><div class="mi-box"><b>Watch</b><span class="d">Complaint rate over the last 7 days, once there are enough emails to read it.</span></div><div class="mi-arrow">→</div><div class="mi-box" style="border-color:#E3C58A;background:#FFFBF2"><b>Warn</b><span class="d">At 80% of the limit: alert a person.</span></div><div class="mi-arrow">→</div><div class="mi-box" style="border-color:#EBA9A9;background:#FFF7F7"><b>Stop releasing</b><span class="d">At the limit: approved emails stay held and a person is asked to look.</span></div><div class="mi-arrow">→</div><div class="mi-box"><b>A person decides</b><span class="d">Resume, lower volume or change the copy. The decision is written to the audit trail.</span></div></div>

        <p class="d" style="margin:6px 0 0">SQLs are rare (${(100 * ms.baseline_sql_rate).toFixed(3)}% of companies), so only large lifts show up in a month. Splitting group B in two for the AI test makes each group smaller, so it takes longer: a point to settle with Clara's real volumes. Sanity checks: ${ms.aa.runs} no-difference re-runs gave ${ms.aa.false_positives} false positive${ms.aa.false_positives === 1 ? "" : "s"} (about ${(0.05 * ms.aa.runs).toFixed(0)} expected), and the groups are balanced.</p>

      </div>

        ${scenarioGroups(runs).map(([g, c]) => `${c} ${g}`).join(", ")}. Each situation is a case in <span class="mono">golden_scenarios.jsonl</span>, run on a fresh database and compared with the expected decision. Seven would leave rules untested; padding to a round hundred would repeat cases.</p></details>
      <details class="card" style="margin-top:14px"><summary>Where the data and the texts come from</summary>
        <p class="d" style="margin:8px 0 0">Every company, person and event is <b>synthetic</b>: a generator creates the 50,000-company world from a fixed seed, so it is identical every time. Nobody real appears anywhere.
        The 117 seed replies, the 89 test situations, the 220 recorded model outputs and the wording of this site were <b>drafted with an AI assistant</b>. A <b>human review of them is still pending</b>. Numbers marked simulated or as assumptions (weights, minutes per task, price per AI call, the experiment) are illustrative and are not Clara's data.</p></details>
      <details class="card" style="margin-top:14px"><summary>Why your changes stay in your browser</summary>
        <p class="d" style="margin:8px 0 0">This is a sandbox on purpose. Each reviewer can change the scoring weights, the minutes per task and the replies to test, and see the whole page react, without affecting anyone else and without anything being stored on a server.

      <div class="grid g4">

        ${tile("Duplicates prevented", fmt(o.duplicates_prevented), "repeated webhooks recognised and ignored: no second email, no second CRM note", tag("exactly-once effects", "good"))}
        ${tile("Unsafe actions prevented", fmt(unsafeTotal), `${fmt(o.unsafe_prevented.ineligible_not_contacted)} outreach attempts blocked or held by the rules, ${fmt(o.unsafe_prevented.late_events_reconciled)} late events reconciled, ${fmt(o.unsafe_prevented.ai_outputs_rejected)} AI outputs rejected`, tag(`${o.unsafe_prevented.opt_out_guard_overrides} opt-out guard overrides in this run`))}
        ${tile("Dead letters", fmt(o.dead_letters), `${pc(o.dead_letters, o.events, 2)} of ${fmt(o.events)} events could not be processed (garbage or retries used up) and were parked with an alert`, stat(deadRate <= 0.015, "target 1.5% or less met", "above 1.5%"))}

const CMP = ["action", "handling", "best_contact_id", "wait_until", "route_to_ae_id", "route_reason", "final_action", "final_reason_codes",
  "send_after", "scope", "contact_id", "cancel_pending_outreach", "usable_fact_ids", "needs_human_review", "automation_allowed"];
function matches(r, x) {
  const rows = [];
  let ok = true;
  for (const k of CMP) {
    if (!(k in x) || ((x[k] === null || (Array.isArray(x[k]) && !x[k].length)) && !["action", "handling", "automation_allowed"].includes(k))) continue;
    const good = JSON.stringify(r[k]) === JSON.stringify(x[k]);
    ok = ok && good; rows.push([k, x[k], r[k], good]);
  }
  if (x.reason_codes && x.reason_codes.length) {
    const good = x.reason_codes.every(c => r.reason_codes.includes(c));
    ok = ok && good; rows.push(["reason_codes", x.reason_codes, r.reason_codes, good]);
  }
  return { ok, rows };
}

function scenarioGroups(runs) {
  const ranges = [["on eligibility rules", 1, 39], ["on duplicates and ordering", 40, 59], ["on replies and AI", 60, 69], ["on failures and retries", 70, 79], ["on personalization", 80, 89],
    ["on enrichment, CRM and calendar failures", 110, 119]];
  const out = ranges.map(([g, lo, hi]) => [g, runs.scenarios.filter(s => { const k = +s.id.slice(1); return k >= lo && k <= hi; }).length]);
  const rest = runs.scenarios.length - out.reduce((s, x) => s + x[1], 0);
  return out.concat([["on routing, limits and mixed cases", rest]]).filter(x => x[1]);
}

// Scoring weights are edited in the browser (kept in localStorage). Mirrors orchestrator/scoring.py; tests/js/scoring.test.mjs checks parity.
function scoreOf(feat, cfg, w) {
  const size = { ideal: w.size, edge: Math.floor(w.size * cfg.size_edge_fraction + 0.5), below: 0, unknown: 0 }[feat.size];
  const pain = feat.pain ? w.pain : 0, sig = Math.min(feat.signals.length, cfg.signal_cap) * w.signal_each, total = size + pain + sig;
  return { score: total, tier: total >= w.tier_a ? "A" : total >= w.tier_b ? "B" : "C", parts: { size, pain, signals: sig } };
}
const WKEY = "orch.weights";
function weights(cfg) { return { ...cfg.weights, tier_a: cfg.tier_a, tier_b: cfg.tier_b, ...(store.get(WKEY) || {}) }; }

function trace(s) {
  const blocks = s.events.map((e, i) => {
    const r = s.results[i], x = s.expected[i];
    const audit = s.audit.filter(a => a.event_id === e.event_id && !["event_received"].includes(a.kind));
    const steps = audit.map(a => {
      const cls = a.kind === "decision" ? "decision" : a.kind.startsWith("ai") || a.kind === "draft" ? "ai" :
        ["alert", "human_review_queued", "internal_error"].includes(a.kind) ? "alert" : "effect";
      const d = { ...a.detail };
      return `<div class="step ${cls}"><div class="k">${esc(a.kind.replaceAll("_", " "))} <span class="d mono">${esc(a.ts || "")}</span></div>
        <div class="d mono">${esc(JSON.stringify(d))}</div></div>`;
    }).join("");
    const m = matches(r, x);
    const email = r.email ? `<div class="email" style="margin-top:8px"><div class="hdr">Mock email · ${esc(r.email.mode)} · ${esc(r.email.status)} · to ${esc(r.email.to)} · send_after ${esc(r.send_after)} — <b>written to the mock ledger, never sent</b></div>

    const ai = r.ai ? `<div style="margin-top:8px"><b>AI:</b> ${Object.entries(r.ai).filter(([k, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length)).map(([k, v]) => tag(`${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`)).join("")}</div>` : "";
    return `<div class="card" style="margin-bottom:10px">
      <div><span class="mono">${esc(e.type || "?")}</span> · delivery <span class="mono">${esc(e.delivery_id)}</span> · source ${esc(e.source || "?")}
      · occurred ${esc(e.occurred_at)} · received ${esc(e.received_at)}</div>
      ${e.payload && e.payload.body_text ? `<pre>${esc(e.payload.body_text)}</pre>` : ""}
      <div style="margin:8px 0">${tag(r.handling, r.handling === "process" ? "" : "acc")} ${act(r.action)} ${r.reason_codes.map(c => tag(c)).join("")}
      ${r.final_action && r.final_action !== r.action ? ` → after execution ${act(r.final_action)} ${r.final_reason_codes.map(c => tag(c)).join("")}` : ""}
      ${r.route_to_ae_id ? tag(`AE ${r.route_to_ae_id} (${r.route_reason})`, "acc") : ""}</div>
      ${ai}${email}
      <details style="margin-top:8px"><summary>Audit trail (${audit.length} steps)</summary>${steps || '<div class="d">Intake only.</div>'}</details>
      <details><summary>Expected vs got: ${m.ok ? '<span class="ok">match</span>' : '<span class="no">differs</span>'}</summary>
        <table class="cmp">${m.rows.map(([k, a, b, g]) => `<tr><td>${esc(k)}</td><td class="mono">${esc(JSON.stringify(a))}</td><td class="mono">${esc(JSON.stringify(b))}</td><td>${g ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'}</td></tr>`).join("")}</table></details>
    </div>`;
  }).join("");
  const mock = Object.keys(s.mock).length ? `Mock behaviour: ${Object.entries(s.mock).map(([k, v]) => tag(`${k}: ${v}`, "warn")).join("")}` : "Mock systems: all ok";
  const calls = s.calls.length ? `<details><summary>External calls (${s.calls.length})</summary><pre>${esc(s.calls.map(c => c.join("  ")).join("\n"))}</pre></details>` : "";
  return `<h2>${esc(s.id)} · ${esc(s.title)}</h2>
    <div class="d" style="margin-bottom:8px">${s.tags.map(t => tag(t)).join("")} ${mock} · ledgers: emails ${s.ledger.send.length}, CRM writes ${s.ledger.crm.length}, meetings ${s.ledger.calendar.length}
    · review queue ${s.review_queue.length} · dead letters ${s.dead_letters.length}</div>${blocks}${calls}`;
}

async function fn(body) {

  handoff_ae: ["Pass to a sales rep", "The prospect shows real interest, so a person from sales takes over.", "🤝"],
  escalate_human: ["A person decides", "The case needs human judgement, so it goes to the review queue.", "👤"],
  suppress: ["Stop contacting", "The prospect asked not to be contacted, so everything pending for that contact is cancelled.", "🛑"],
  enrich: ["Find the right contact", "The reply points to someone else, so the system looks for that person first.", "🔎"],
  no_action: ["Nothing to do", "An automatic message, so no action is needed.", "✓"],
};
const LABEL_PLAIN = { interested: "Interested", not_now: "Not now", out_of_office: "Out of office", wrong_person: "Wrong person", unsubscribe: "Asks to stop", objection: "Objection",
  info_request: "Asks for information", mixed_signals: "Mixed signals", ambiguous: "Unclear", auto_reply: "Automatic reply", hostile: "Hostile", prompt_injection: "Tries to trick the AI", empty_or_truncated: "Empty or cut off" };
const niceDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
// Same rule as the engine (engine.py, action "wait"): the date the reply states, otherwise 7 days after it. Shown here so the demo makes the follow-up visible.
function nextCheck(j) {
  const fu = j.extracted && j.extracted.follow_up_date, base = j.received_date;
  if (fu && /^\d{4}-\d{2}-\d{2}$/.test(fu)) return { date: fu, why: "the date the prospect gave" };
  if (!base) return null;
  const d = new Date(base + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 7);
  return { date: d.toISOString().slice(0, 10), why: "no date was given, so the default of 7 days applies" };
}

function renderReply(j) {
  const raw = (j.attempts || []).map((a, i) => `<div class="d">Attempt ${i + 1} · ${esc(a.model)} · ${a.latency_ms} ms · ${a.input_tokens}+${a.output_tokens} tokens · ${tag(a.verdict)} ${a.codes.map(c => tag(c, "warn")).join("")}</div><pre>${esc(a.raw)}</pre>`).join("");
  const [title, sentence, icon] = REPLY_PLAIN[j.action] || [j.action, "", "•"], x = j.extracted || {}, q = x.qualification || {};
  const nc = j.action === "wait" ? nextCheck(j) : null;
  const understood = [
    j.label ? ["Type of reply", `${LABEL_PLAIN[j.label] || j.label}${j.confidence != null ? ` (${Math.round(j.confidence * 100)}% sure)` : ""}`] : null,
    x.interest_level && x.interest_level !== "unclear" ? ["Interest", x.interest_level] : null,
    x.follow_up_date ? ["Date given", niceDate(x.follow_up_date)] : null,
    x.referred_contact ? ["Points to", x.referred_contact.name || x.referred_contact.email || "another person"] : null,
    q.team_size ? ["Team size", q.team_size] : null, q.current_solution ? ["Today they use", q.current_solution] : null,
    q.timeline_months ? ["Wants it within", `${q.timeline_months} months`] : null, (q.countries || []).length ? ["Countries", q.countries.join(", ")] : null,
    (q.pain_points || []).length ? ["Pain points", q.pain_points.join(", ")] : null,
  ].filter(Boolean);
  const ok = j.verdict === "accept";
  return `<h3>Result</h3>
    <div class="rhero"><div class="ric" aria-hidden="true">${icon}</div><div><div class="rt">${esc(title)}</div><div class="d">${esc(sentence)}</div></div></div>
    ${nc ? `<div class="rnext"><div class="d">Next check</div><div class="rd">📅 ${esc(niceDate(nc.date))}</div><div class="d">${esc(nc.why)}. Pending emails for this contact are cancelled meanwhile.</div></div>` : ""}
    ${understood.length ? `<h4 class="rh">What the AI understood</h4><div class="rchips">${understood.map(([k, v]) => `<div class="rc"><span class="d">${esc(k)}</span><b>${esc(String(v))}</b></div>`).join("")}</div>` : ""}
    <h4 class="rh">Safety checks</h4>
    <div class="rchecks"><div>${ok ? "✅" : "⚠️"} Rules checked the AI's answer: <b>${ok ? "accepted" : esc(j.verdict || "needs review")}</b>${j.needs_human_review ? ` ${tag("human review", "warn")}` : ""}</div>
      <div>✅ The action was chosen by rules, not by the AI (account state: ${esc(j.crm_state)})</div>
      <div>${j.email_sent ? "⚠️ An email was sent" : "✅ No email sent: this function cannot send email"}</div></div>
    <details style="margin-top:12px"><summary>Technical details</summary>
      <table class="cmp" style="margin-top:8px">
        <tr><td>action (rules)</td><td>${act(j.action)} ${(j.reason_codes || []).map(c => tag(c)).join("")}</td></tr>
        <tr><td>label (model)</td><td>${esc(j.label ?? "—")} ${j.confidence != null ? `(${j.confidence})` : ""}</td></tr>
        <tr><td>validator verdict</td><td>${tag(j.verdict)} ${(j.violation_codes || []).map(c => tag(c, "warn")).join("")}</td></tr>
        <tr><td>extracted</td><td><pre>${J(j.extracted)}</pre></td></tr>
      </table>
      <h4 class="rh">Raw model output</h4>${raw || '<div class="d">No model call (empty reply or model unavailable).</div>'}
      <div class="d" style="margin-top:6px">Codes: V006 quote not in the reply · V007 invented referral · V008 invented/past date · V009 invented qualification ·
      V010 model's suggested action overridden · V011 low confidence · V012 injection missed · G001 opt-out guard.</div></details>`;
}

const FACT_AS_OF = "2026-10-01";
function factStatus(f, usable) {                      // the rules decide; this only explains a "no" in plain words
  if (usable) return ["ok", "✓ Allowed"];
  if (!f.is_verified) return ["blocked", "✗ Blocked: not verified"];
  if ((Date.parse(FACT_AS_OF) - Date.parse(f.observed_at)) / 864e5 > 365) return ["blocked", "✗ Blocked: over a year old"];
  return ["blocked", "✗ Blocked: about another company or clashes with the CRM"];
}
function renderDraft(j, sent) {
  const text = id => { const n = /(\d+)$/.exec(id || ""); return n && sent[+n[1] - 1] ? sent[+n[1] - 1].text : ""; };
  const ok = j.verdict === "accept", used = j.usable_fact_ids.length > 0;
  const head = !used ? ["ℹ️", "No fact passed the rules, so the email is the generic template and the model was not called."]
    : ok ? ["✅", "The AI's opening line passed every check."] : ["⚠️", "The AI's draft failed a check, so it was not used. The generic template stands in."];
  const ai = ok && used && j.claims && j.claims.length ? `<div class="aipart"><b>✨ The only part the AI wrote: the opening line</b>
      ${j.claims.map(c => `<div class="cl">“${esc(c.text)}”<div class="d">Backed by the fact: ${esc(text(c.fact_id) || c.fact_id)}</div></div>`).join("")}</div>` : "";
  return `<h3>Result</h3>
    <div class="dverdict"><span aria-hidden="true">${head[0]}</span><span>${esc(head[1])}</span></div>${ai}
    <div class="email" style="margin-top:8px"><div class="hdr">Preview only · nothing is sent</div><div><b>${esc(j.subject)}</b></div><div class="body">${esc(j.body)}</div></div>
    <details style="margin-top:12px"><summary>Technical details</summary>
      <div class="d" style="margin-top:6px">Verdict: ${tag(j.verdict, ok ? "good" : "warn")} ${(j.codes || []).map(c => tag(c, "warn")).join("")} · mode: ${esc(j.mode)}</div>
      <div class="d">Facts the rules approved: ${used ? j.usable_fact_ids.map(f => tag(f, "good")).join("") : "none"}</div>
      <h4 class="rh">Raw model output (${(j.attempts || []).length} call${(j.attempts || []).length === 1 ? "" : "s"})</h4>${(j.attempts || []).map(a => `<pre>${esc(a.raw)}</pre>`).join("") || '<div class="d">No model call.</div>'}
      <div class="d" style="margin-top:6px">P004 unknown fact · P005 fact not usable · P006 claim adds details · P007 forbidden claim · P008 footer missing · P013 claim not in body · P015 template modified.</div></details>`;
}

let facts = [], factUsable = null;                    // factUsable: after a run, the ids the rules approved, in the order sent
function drawFacts() {
  const sentIdx = []; facts.forEach((f, i) => { if (f.text.trim()) sentIdx.push(i); });
  $("#facts").innerHTML = facts.map((f, i) => { const pos = sentIdx.indexOf(i), st = factUsable && pos >= 0 ? factStatus(f, factUsable.includes(`fct_edit_${pos + 1}`)) : null;
    return `<div class="fcard ${st ? st[0] : ""}"><input type="text" data-fi="${i}" value="${esc(f.text)}" maxlength="300" placeholder="A fact about the company" aria-label="Fact ${i + 1}" />
      <div class="fmeta"><label><input type="checkbox" data-fv="${i}" ${f.is_verified ? "checked" : ""}/> Verified</label>
      <label>Seen on <input type="date" data-fo="${i}" value="${esc((f.observed_at || "").slice(0, 10))}" aria-label="Date seen" /></label>${st ? `<span class="fstat ${st[0] === "ok" ? "ok" : ""}">${st[1]}</span>` : ""}</div></div>`; }).join("");
}

async function bindLive() {
  const cases = await load("cases");
  const setCase = id => { const c = cases.cases.find(x => x.case_id === id); factUsable = null; facts = c.input.facts.map(f => ({ text: f.text, is_verified: f.is_verified, observed_at: f.observed_at })); drawFacts(); };
  setCase($("#dcase").value);
  $("#dcase").onchange = e => setCase(e.target.value);
  $("#addFact").onclick = () => { if (facts.length < 5) { facts.push({ text: "", is_verified: true, observed_at: "2026-09-01T16:00:00Z" }); drawFacts(); } };
  $("#facts").oninput = e => { const t = e.target;
    if (t.dataset.fi) facts[+t.dataset.fi].text = t.value; if (t.dataset.fo && t.value) facts[+t.dataset.fo].observed_at = `${t.value}T16:00:00Z`;
    if (t.dataset.fv) facts[+t.dataset.fv].is_verified = t.checked;
    if (factUsable && !t.dataset.fi) { factUsable = null; drawFacts(); } };   // a change makes the old verdicts stale
  $("#samples").onclick = e => { const i = e.target.dataset.sample; if (i !== undefined) { $("#reply").value = SAMPLES[+i].text; store.set("orch.replyText", $("#reply").value); } };
  const typed = store.get("orch.replyText"); if (typed && !LIVE.reply) $("#reply").value = typed;
  $("#reply").oninput = () => store.set("orch.replyText", $("#reply").value);

  }
  if (LIVE.draft && cases.cases.some(c => c.case_id === LIVE.draft.case_id)) {   // and the last draft run
    $("#dcase").value = LIVE.draft.case_id;
    facts = LIVE.draft.facts.map(f => ({ text: f.text, is_verified: f.is_verified, observed_at: f.observed_at })); factUsable = LIVE.draft.usable || null; drawFacts();
    $("#draftOut").innerHTML = LIVE.draft.html;
  }
  $("#runReply").onclick = async () => {
    const b = $("#runReply"); b.disabled = true; $("#replyOut").innerHTML = '<div class="d">Calling the model…</div>';

    try { LIVE.reply = { input, html: renderReply(await fn({ task: "reply", ...input })) }; }
    catch (e) { LIVE.reply = { input, html: `<div class="no">${esc(e.message)}</div>` }; }
    store.set("orch.liveReply", LIVE.reply);
    if ($("#replyOut")) { $("#replyOut").innerHTML = LIVE.reply.html; $("#runReply").disabled = false; }
  };
  $("#runDraft").onclick = async () => {
    const b = $("#runDraft"); b.disabled = true; $("#draftOut").innerHTML = '<div class="d">Calling the model…</div>';
    const case_id = $("#dcase").value, sent = facts.filter(f => f.text.trim());
    try { const j = await fn({ task: "draft", case_id, facts: sent }); LIVE.draft = { case_id, facts: sent, usable: j.usable_fact_ids, html: renderDraft(j, sent) }; factUsable = j.usable_fact_ids; drawFacts(); }
    catch (e) { LIVE.draft = { case_id, facts: sent, html: `<div class="no">${esc(e.message)}</div>` }; }
    store.set("orch.liveDraft", LIVE.draft);
    if ($("#draftOut")) { $("#draftOut").innerHTML = LIVE.draft.html; $("#runDraft").disabled = false; }

    $("#status").className = st.configured ? "banner" : "banner warn";
    $("#status").textContent = st.configured ? `Live model configured: ${st.model}. Emails: none — this function cannot send email.` :
      "The live model is not configured on this site (ANTHROPIC_API_KEY missing). The recorded runs and evals still work.";
  }).catch(e => { if ($("#status")) $("#status").textContent = "Live function unreachable: " + e.message; });

// Live results live outside the views: switching sections never loses them, and a run keeps going in the background.
// They are also kept in this browser (localStorage) so a reload shows the last run. Wrapped in try/catch: storage
// can be unavailable (private window, blocked site data) and the page must still work.
const MEM = {};                                           // always works: survives tab changes even when the browser blocks storage
let CAN_SAVE = true;
try { localStorage.setItem("orch.probe", "1"); localStorage.removeItem("orch.probe"); } catch { CAN_SAVE = false; }
const store = {
  get(k) {
    if (k in MEM) return MEM[k];
    try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; }
  },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function resetDemo() {
  if (!confirm("Reset the demo? This clears your edited weights, minutes, saved versions and live results in this browser. Nothing else is affected.")) return;
  Object.keys(MEM).forEach(k => delete MEM[k]);
  try { Object.keys(localStorage).filter(k => k.startsWith("orch.")).forEach(k => localStorage.removeItem(k)); } catch {}
  try { history.replaceState(null, "", "#overview"); } catch {}
  location.reload();
}
// Open / closed state of every <details>, remembered by view + title, so a trace you opened is still open when you come back.
const DETKEY = "orch.details";
const detKey = d => { const s = (d.querySelector(":scope > summary") || {}).textContent || ""; const same = [...document.querySelectorAll("#main details")].filter(x => ((x.querySelector(":scope > summary") || {}).textContent || "") === s);
  return `${state.view}|${s.trim().slice(0, 60)}|${same.indexOf(d)}`; };
function restoreDetails(root) {
  const saved = store.get(DETKEY) || {};
  (root || document.querySelector("#main")).querySelectorAll("details").forEach(d => { const v = saved[detKey(d)]; if (v !== undefined && d.open !== v) d.open = v; });
}

if (LIVE.eval) LIVE.eval.running = false;            // a run interrupted by a reload is shown as partial

const clip = (t, n = 150) => t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t;

function renderCaseGrid() {
  const out = $("#caseGrid"); if (!out || !CASES_CACHE) return;
  const run = LIVE.eval && LIVE.eval.out && LIVE.eval.out.length ? LIVE.eval.out : EVAL_SAVED, res = Object.fromEntries(run.map(r => [r.case_id, r]));
  const byId = Object.fromEntries(CASES_CACHE.cases.map(c => [c.case_id, c]));

    const r = res[id]; if (!r) return '<span class="d">Not run yet</span>';

    const sameLabel = r.label_correct ? "" : ` <span class="d">(read it as “${esc(LABEL_PLAIN[r.label] || r.label || "?")}”)</span>`;
    return r.action_correct ? `<span class="ok">✓ Right next step</span>${sameLabel}` : r.unsafe ? '<span class="no">✗ Unsafe step</span>' : `<span class="no">✗ Different step</span>${sameLabel}`;
  };
  const card = (id, why, quote, label, kind) => { const r = res[id], good = r && (kind === "draft" ? r.grounded : r.action_correct);
    return `<div class="ccase ${r ? (good ? "pass" : "diff") : ""}"><div>${tag(label, "acc")}</div>${quote ? `<div class="q" title="${esc(quote)}">${esc(clip(quote))}</div>` : ""}<div class="why">${esc(why)}</div><div class="res">${status(id, kind)}</div></div>`; };
  const groups = CASE_GROUPS.map(([action, ids]) => { const [title, , icon] = REPLY_PLAIN[action];
    return `<div class="cgrp"><span aria-hidden="true">${icon}</span> Should end as: ${esc(title)} <span class="d">· ${ids.length} case${ids.length > 1 ? "s" : ""}</span></div>
      <div class="cgrid">${ids.map(id => { const c = byId[id]; return c ? card(id, CASE_WHY[id], c.input.reply_text, LABEL_PLAIN[c.expected.label] || c.expected.label, "reply") : ""; }).join("")}</div>`; }).join("");
  const drafts = ["EV-G080", "EV-G081", "EV-G082", "EV-G083"].filter(id => byId[id]);

function renderEval() {
  const e = LIVE.eval, out = $("#evalOut");
  if (!out) return;                                   // another section is open: the run continues, nothing to draw
  $("#runEval").disabled = Boolean(e && e.running);
  $("#runEval").textContent = e && !e.running ? "Run the live eval again" : "Run the live eval";
  $("#evalProg").textContent = !e ? "" : e.running ? e.progress :
    `${e.complete ? "Last run" : "Partial run (interrupted)"}: ${e.payload.ran_at} · ${e.payload.model}`;
  $("#dlEval").classList.toggle("hidden", !(e && !e.running && e.out.length));
  out.innerHTML = e ? evalTable(e.out) : "";
  renderCaseGrid();
}

function evalPayload(out) {
  const model = (out.find(r => r.model) || {}).model || "unknown";
  return { suite: "live", source: "netlify function (web page)", model, ran_at: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
    summary: evalSummary(out), cases: out };
}

async function runEval() {
  const cases = await load("cases");
  LIVE.eval = { out: [], running: true, complete: false, progress: "starting…", payload: null };
  renderEval();
  for (const [i, c] of cases.cases.entries()) {
    LIVE.eval.progress = `case ${i + 1}/${cases.cases.length}: ${c.case_id}`;
    renderEval();
    try { LIVE.eval.out.push(await fn({ task: "eval_case", case_id: c.case_id })); }
    catch (e) { LIVE.eval.out.push({ case_id: c.case_id, error: e.message }); if (/not configured/.test(e.message)) break; }
    LIVE.eval.payload = evalPayload(LIVE.eval.out);
    store.set("orch.liveEval", LIVE.eval);
  }
  LIVE.eval.running = false;
  LIVE.eval.complete = LIVE.eval.out.length === cases.cases.length;
  LIVE.eval.payload = evalPayload(LIVE.eval.out);
  store.set("orch.liveEval", LIVE.eval);
  renderEval();
}

function bindEvals() {
  $("#runEval").onclick = () => { if (!(LIVE.eval && LIVE.eval.running)) runEval(); };
  $("#dlEval").onclick = () => {
    const p = LIVE.eval.payload, a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(p, null, 2)], { type: "application/json" }));
    a.download = `live-eval-${p.ran_at.replace(/[:-]/g, "")}.json`; a.click();
  };
  load("cases").then(c => { CASES_CACHE = c; renderCaseGrid(); });
  renderEval();
}

function evalSummary(out) {
  const rep = out.filter(r => r.kind === "reply"), dr = out.filter(r => r.kind === "draft");
  const pct = (a, b) => b ? `${a}/${b} (${Math.round(100 * a / b)}%)` : "—";
  return { reply_cases: rep.length, label_accuracy: pct(rep.filter(r => r.label_correct).length, rep.length),
    action_accuracy: pct(rep.filter(r => r.action_correct).length, rep.length), unsafe_actions: out.filter(r => r.unsafe).length,
    field_accuracy: pct(rep.reduce((s, r) => s + r.fields_correct, 0), rep.reduce((s, r) => s + r.fields_total, 0)),
    drafts_grounded: pct(dr.filter(r => r.grounded).length, dr.length), errors: out.filter(r => r.error).length };
}

// Time model. Counts come from the engine's decisions on all 50,000 accounts; minutes are editable assumptions.
const MKEY = "orch.minutes";
function taskCount(ov, id) {
  const A = outcomeActions(ov);
  return { check: ov.n_accounts, enrich: A.enrich, prioritize: ov.actions.contact, email: A.contact, nurture: A.nurture || 0, route: A.handoff_ae, review: A.escalate_human, spot: A.contact }[id] || 0;
}
function hoursModel(ov) {
  const saved = store.get(MKEY) || {}, m = {};
  for (const t of [...ov.time.tasks, ...ov.time.people_still_needed]) m[t.id] = saved[t.id] ?? (t.manual_minutes ?? t.minutes);
  const h = id => taskCount(ov, id) * m[id] / 60;
  const byHand = ov.time.tasks.reduce((s, t) => s + h(t.id), 0), still = ov.time.people_still_needed.reduce((s, t) => s + h(t.id), 0);
  return { m, h, byHand, still, saved: byHand - still, months: (byHand - still) / ov.time.hours_per_person_month, usd: (byHand - still) * ov.time.people_cost_usd_per_hour };
}

function tierModel(ov, w = weights(ov.config)) {
  const T = { A: { all: 0, ready: 0 }, B: { all: 0, ready: 0 }, C: { all: 0, ready: 0 } }, list = [];
  let blockedA = 0;
  for (const g of ov.groups) {
    const s = scoreOf({ size: g.size, pain: g.pain, signals: new Array(g.signals) }, ov.config, w);
    for (const [a, n] of Object.entries(g.counts)) { T[s.tier].all += n; if (a === "contact") T[s.tier].ready += n; else if (s.tier === "A") blockedA += n; }
    for (const e of g.examples) list.push({ ...e, s });
  }
  list.sort((x, y) => y.s.score - x.s.score || (x.id < y.id ? -1 : 1));
  return { w, T, list, blockedA };
}
// What the engine ends up doing: eligible accounts split into a drafted outreach email (A, B) and nurture (C).
function outcomeActions(ov) {
  const { T } = tierModel(ov), A = { ...ov.actions };
  if (ov.config.gate_enabled) { A.nurture = T.C.ready; A.contact = T.A.ready + T.B.ready; }
  return A;
}

  return `${size[0].toUpperCase() + size.slice(1)}, ${sig}${e.pain ? ", likely handling payments manually" : ""}.`;
}

function bindMonth() {

  const sum = (r, ks) => ks.reduce((t, k) => t + r[C[k]], 0), grp = { A: ["email", "nurture", "wait", "lookup"], P: ["sales", "review"], B: ["blocked"] };
  const row = p => { const x = p * (N - 1), i = Math.floor(x), f = x - i, a = rp.rows[i], b = rp.rows[Math.min(N - 1, i + 1)]; return a.map((v, k) => k === 1 ? (f < .5 ? v : b[k]) : v + (b[k] - v) * f); };

  };

  const base = cmp.runs[ov.config.active_version], baseAB = base.ready_by_tier.A + base.ready_by_tier.B;
  const emails = base.emails_prepared + (ab - baseAB), draft = base.draft_calls / base.emails_prepared * emails, calls = draft + base.reply_calls;   // every company that leaves nurture gets one outreach email, as the engine measured

      <table style="margin-top:10px"><thead><tr><th>ready companies in…</th><th>A</th><th>B</th><th>change</th></tr></thead><tbody>
      ${["A", "B", "C"].map(t => `<tr><td>${TIER_NAME[t]}</td><td>${fmt(A.T[t].ready)}</td><td>${fmt(B.T[t].ready)}</td>
        <td>${B.T[t].ready - A.T[t].ready ? `<span class="${B.T[t].ready > A.T[t].ready ? "up" : "down"}">${B.T[t].ready > A.T[t].ready ? "+" : ""}${fmt(B.T[t].ready - A.T[t].ready)}</span>` : "·"}</td></tr>`).join("")}</tbody></table>
      ${vb.draft && !changed && ov.config.versions.some(v => v.status === "proposed") ? `<p class="d" style="margin:10px 0 0">Version B is your edits, which equal version A. <button class="btn ghost mini" id="verProp">Compare with the official proposal</button></p>` : ""}
      <h3 style="margin:14px 0 6px">${fmt(changed)} of ${fmt(total)} ready companies (${total ? (100 * changed / total).toFixed(1) : 0}%) change group</h3>
      <div class="tablewrap"><table class="matrix"><thead><tr><th>A \ B</th>${["A", "B", "C"].map(t => `<th>${TIER_NAME[t]}</th>`).join("")}</tr></thead><tbody>
      ${["A", "B", "C"].map(r => `<tr><th>${TIER_NAME[r]}</th>${["A", "B", "C"].map(c => cell(r, c)).join("")}</tr>`).join("")}</tbody></table></div></div>
    <div class="card" style="margin-top:12px"><h3>What the change means in practice</h3>
      <div class="tablewrap"><table><thead><tr><th></th><th>A ${eA.measured ? '<span class="tag good">measured</span>' : '<span class="tag warn">estimated</span>'}</th><th>B ${eB.measured ? '<span class="tag good">measured</span>' : '<span class="tag warn">estimated</span>'}</th><th>change</th></tr></thead><tbody>
        ${row("Outreach emails prepared", eA.emails, eB.emails)}${row("Enrolled in nurture", eA.nurture, eB.nurture)}${row("AI model calls", eA.aiCalls, eB.aiCalls)}
        ${row("Estimated AI cost", eA.aiCost, eB.aiCost, x => "USD " + x.toFixed(2))}${row("People hours avoided (my time assumptions)", eA.hours, eB.hours)}</tbody></table></div>
      <p class="d" style="margin:8px 0 0"><b>Measured</b> means the whole event stream of the ${fmt(ov.n_accounts)} companies ran through the real engine with that version (<span class="mono">${esc(cmp.command)}</span>). <b>Estimated</b> means this page scaled the measured ratios to your weights. More outreach emails also means a bigger approval queue.</p></div>
    <div class="card" style="margin-top:12px"><h3>Who changes group</h3>
      ${mv.length ? `<div class="tablewrap"><table><thead><tr><th>company</th><th>with A</th><th>with B</th></tr></thead><tbody>${mv.map(m => `<tr><td><b>${esc(m.e.name)}</b><div class="d">${esc(m.e.country)} · ${m.e.employees ?? "?"} employees</div></td>
        <td>${pointsLine(m.a.parts)} = <b>${m.a.score}</b> ${tag(TIER_NAME[m.a.tier])}</td><td>${pointsLine(m.b.parts)} = <b>${m.b.score}</b> ${tag(TIER_NAME[m.b.tier], m.b.tier === "A" ? "good" : m.b.tier === "B" ? "acc" : "")}</td></tr>`).join("")}</tbody></table></div>
        <p class="d" style="margin:6px 0 0">Examples with the largest score change, out of ${fmt(changed)} companies that move.</p>` : '<p class="d" style="margin:0">With these two versions no company changes group.</p>'}</div>
    <details class="card" style="margin-top:12px"><summary>Save your edits as a new version</summary>
      <div class="grid g2"><div><label class="small" for="verName">Name</label><input type="text" id="verName" placeholder="e.g. Raised the weight of size"></div>
      <div><label class="small" for="verNote">What changed and why (optional)</label><input type="text" id="verNote"></div></div>
      <p style="margin:10px 0 0"><button class="btn" id="verSave">Save version</button> <button class="btn ghost" id="verDl">Download version B as JSON</button></p>
      <p class="d">Saved versions stay in this browser. To make one the version the engine uses, add the downloaded JSON to <span class="mono">versions</span> in <span class="mono">data/seed/scoring_policy.json</span>, set <span class="mono">active_version</span>, and run the export. The engine records the version in every score it logs.</p></details>
    <h3 style="margin:18px 0 6px">Change log: every version, in order</h3>
    <p class="d" style="margin:0 0 6px">A change is identified by its weights and the data it was scored on. The engine records the version id in every score it logs, so any past decision can be traced to the version that made it. Effects are measured by running the whole stream per version.</p>
    <div class="card"><div class="tablewrap"><table><thead><tr><th>version</th><th>date</th><th>data</th><th>weights</th><th>effect on the previous version</th><th></th></tr></thead><tbody>${saved}</tbody></table></div></div>`;
  if ($("#verProp")) $("#verProp").onclick = () => { PRI.b = ov.config.versions.find(v => v.status === "proposed").id; renderPriority(); };
  $("#verA").onchange = e => { PRI.a = e.target.value; renderPriority(); };
  $("#verB").onchange = e => { PRI.b = e.target.value; renderPriority(); };
  $("#verSave").onclick = () => {
    const name = $("#verName").value.trim(); if (!name) { $("#verName").focus(); return; }
    const w = weights(ov.config), id = "local-" + Date.now();
    const act = vers.find(v => v.active), mv_ = movement(ov, act.weights, w), e1 = effectOf(ov, cmp, act.id, act.weights), e2 = effectOf(ov, cmp, "x", w);
    const effect = { vs: act.name, moved: mv_.changed, emails: e2.emails - e1.emails, nurture: e2.nurture - e1.nurture, aiCost: e2.aiCost - e1.aiCost };
    store.set(VKEY, [...localVersions(), { id, name, note: $("#verNote").value.trim(), date: new Date().toISOString().slice(0, 10), dataset: ov.dataset.id, weights: w, effect }]);
    PRI.b = id; renderPriority();
  };
  $("#verDl").onclick = () => {
    const v = vers.find(x => x.id === PRI.b) || vers[vers.length - 1], a = document.createElement("a");
    const json = { id: v.draft ? "vNEW" : v.id, name: v.draft ? "New version" : v.name, date: new Date().toISOString().slice(0, 10), dataset: ov.dataset.id, weights: v.weights, note: v.note || "" };
    a.href = URL.createObjectURL(new Blob([JSON.stringify(json, null, 2)], { type: "application/json" })); a.download = `scoring-version-${json.id}.json`; a.click();
  };
  out.querySelectorAll("[data-delver]").forEach(b => b.onclick = () => { store.set(VKEY, localVersions().filter(v => v.id !== b.dataset.delver)); if (PRI.b === b.dataset.delver) PRI.b = "draft"; if (PRI.a === b.dataset.delver) PRI.a = ov.config.active_version; renderPriority(); });
}

function renderAutomation() {
  const out = $("#autoOut"); if (!out) return;
  const ov = DATA.overview, hm = hoursModel(ov), P = ov.plain;
  const inp = id => `<input type="number" step="0.5" min="0" class="mini" data-min="${id}" value="${hm.m[id]}">`;
  const trow = t => `<tr><td><b>${esc(t.name)}</b><div class="d">${esc(t.does)}</div></td><td>${esc(t.applies_to)}<div class="d">${fmt(taskCount(ov, t.id))} accounts</div></td>
    <td>${inp(t.id)} min</td><td>${fmt(hm.h(t.id))} h</td><td><span class="ok">0 h</span></td></tr>`;
  const prow = t => `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.applies_to)}<div class="d">${fmt(taskCount(ov, t.id))} accounts</div></td><td>${inp(t.id)} min</td><td colspan="2">${fmt(hm.h(t.id))} h of people time</td></tr>`;
  const OA = outcomeActions(ov);
  const reasons = ACTION_ORDER.map(k => `<tr><td><b>${esc(P.actions[k][0])}</b><div class="d">${esc(P.actions[k][1])}</div></td><td style="white-space:nowrap"><b>${fmt(OA[k] || 0)}</b></td>
    <td class="d">${Object.entries(k === "nurture" ? { LOW_PRIORITY: OA.nurture } : k === "contact" ? { ELIGIBLE: OA.contact } : (ov.reasons[k] || {})).slice(0, 4).map(([c, n]) => `${esc(P.codes[c] || c)} <b>${fmt(n)}</b>`).join(" · ")}</td></tr>`).join("");
  out.innerHTML = `<div class="grid g3" style="margin-bottom:12px">
      <div class="card kpi big"><div class="v">${fmt(hm.byHand)} h</div><div class="l">if people did all of it by hand</div></div>
      <div class="card kpi big"><div class="v">${fmt(hm.saved)} h</div><div class="l">avoided: about ${hm.months.toFixed(1)} people-months, around USD ${fmt(hm.usd)} at USD ${ov.time.people_cost_usd_per_hour}/h</div></div>
      <div class="card kpi big"><div class="v">${fmt(hm.still)} h</div><div class="l">people still spend, on cases that need judgment</div></div></div>
    <div class="card tablewrap"><table><thead><tr><th>task</th><th>who it applies to</th><th>by hand, per account</th><th>by hand, total</th><th>with the system</th></tr></thead><tbody>
      ${ov.time.tasks.map(trow).join("")}<tr><td colspan="5"><b>What people still do</b></td></tr>${ov.time.people_still_needed.map(prow).join("")}</tbody></table>
      <p style="margin:10px 0 0"><button class="btn ghost" id="mReset">Reset to my defaults</button></p></div>
    <p class="d">${esc(ov.time.status)} A "month" is ${ov.time.hours_per_person_month} working hours per person. The system's own time is seconds for all 50,000 and is not counted.</p>
    <h2>What it decided, and why</h2><div class="card tablewrap"><table><thead><tr><th>decision</th><th style="white-space:nowrap">companies</th><th>main reasons</th></tr></thead><tbody>${reasons}</tbody></table></div>
    <h2>What came in</h2><div class="card">${Object.entries(ov.events).map(([k, n]) => bar(EVENT_TEXT[k] || k, n, ov.events_total, "var(--accent)")).join("")}
      <p class="d" style="margin:8px 0 0">${fmt(ov.events_total)} events in total. Each one updates what the system knows and can trigger a new decision.</p></div>`;
  document.querySelectorAll("[data-min]").forEach(i => i.onchange = () => {
    store.set(MKEY, { ...(store.get(MKEY) || {}), [i.dataset.min]: Math.max(0, Number(i.value) || 0) }); renderAutomation();
  });
  $("#mReset").onclick = () => { store.set(MKEY, null); renderAutomation(); };
}
function bindAutomation() { renderAutomation(); }

const autoTone = l => /^Automate, then/.test(l) ? "approve" : /^Automate/.test(l) ? "yes" : /^Hand/.test(l) ? "person" : "no";
function renderAccount(id) {
  const d = DATA.scoring, a = d.accounts.find(x => x.id === id), out = $("#audOut"); if (!a || !out) return;
  const P = d.plain, bad = Object.fromEntries(a.not_pass.map(([c, st, code]) => [c, [st, code]])), w = weights(d.config), s = scoreOf(a.feat, d.config, w);
  const ico = st => st === "pass" ? '<span class="ok">✓ OK</span>' : st === "fail" ? '<span class="no">✗ Blocked</span>' : '<span style="color:var(--warn);font-weight:600">? Missing data</span>';
  const checks = d.check_order.map(c => { const [st, code] = bad[c] || ["pass", null];
    return `<tr><td>${esc(d.check_labels[c])}</td><td>${ico(st)}</td><td class="d">${code ? esc(P.codes[code] || code) : ""}</td></tr>`; }).join("");
  const nurture = a.decision.action === "contact" && s.tier === "C" && d.config.gate_enabled, act = P.actions[nurture ? "nurture" : a.decision.action], auto = P.automation[nurture ? "nurture" : a.decision.action];
  const parts = [["Company size", s.parts.size, w.size], ["Likely payment pain", s.parts.pain, w.pain], ["Growth signals", s.parts.signals, w.signal_each * d.config.signal_cap]]
    .map(([n, v, m]) => bar(n, v, Math.max(m, 1), "var(--accent)")).join("");
  const dr = a.draft && !nurture ? `<div class="email" style="margin-top:10px"><div class="hdr">Prepared email to ${esc(a.draft.to)} · an AI-written opening line would be added here, using only verified facts · <b>simulated, never sent</b></div>
    <div><b>${esc(a.draft.subject)}</b></div><div class="body">${esc(a.draft.body)}</div>
    <div class="d" style="margin-top:6px">Facts the email is allowed to mention: ${a.draft.facts.length ? a.draft.facts.map(esc).join(" · ") : "none (so it stays generic)"}</div></div>` : "";
  out.innerHTML = `<div class="card" style="margin-top:12px"><h2 style="margin-top:0">${esc(a.name)}</h2>
    <div class="d">${esc(a.country)} · ${esc(a.industry)} · ${a.employees ?? "unknown"} employees</div>
    <div class="timeline">
      <div class="tl"><div class="n">1</div><div><h3>What we know</h3>${a.feat.signals.length ? a.feat.signals.map(x => tag(x)).join("") : '<span class="d">No growth signals on file.</span>'}
        ${a.feat.pain_text ? `<div class="d">Hypothesis (inferred, not confirmed): ${esc(a.feat.pain_text.replace(/^Hypothesis \(inferred\):\s*/i, ""))}</div>` : ""}</div></div>
      <div class="tl"><div class="n">2</div><div><h3>Safety checks: ${a.not_pass.length ? `${d.check_order.length - a.not_pass.length} of ${d.check_order.length} passed` : `all ${d.check_order.length} passed`}</h3>
        <details ${a.not_pass.length ? "open" : ""}><summary class="d">${a.not_pass.length ? "Hide the list" : "Show the list"}</summary><div class="tablewrap"><table><tbody>${checks}</tbody></table></div></details>
        <div class="d">Anything that is not a clear OK blocks the email. Missing data means "look it up first", never "assume it is fine".</div></div></div>
      <div class="tl"><div class="n">3</div><div><h3>Priority: ${s.score} / 100 · ${esc(TIER_NAME[s.tier])}</h3>${parts}</div></div>
      <div class="tl"><div class="n">4</div><div><h3>Decision: ${esc(act[0])}</h3>
        <div class="verdict ${autoTone(auto[0])}"><div class="d">Can we safely automate it?</div><b>${esc(auto[0])}</b> · ${esc(auto[1])}</div><div>${esc(act[1])}</div>
        <div style="margin-top:4px">${(nurture ? ["LOW_PRIORITY"] : a.decision.codes).map(c => tag(P.codes[c] || c)).join("")}</div>${dr}</div></div>
    </div></div>`;
}
function bindAccount() {
  const go = id => { state.acc = id; $("#audSel").value = id; document.querySelectorAll("#audEx button").forEach(b => b.classList.toggle("active", b.dataset.acc === id)); renderAccount(id); };
  $("#audSel").onchange = e => go(e.target.value);
  $("#audEx").onclick = e => { const b = e.target.closest("[data-acc]"); if (b) go(b.dataset.acc); };
  renderAccount($("#audSel").value);
}

// Seven tabs. Decisions, AI & Safety and Operations each hold sections, so the menu stays short and every tab answers one question.
const SEC = { priority: VIEWS.priority, automation: VIEWS.automation, account: VIEWS.account, live: VIEWS.live, evals: VIEWS.evals, ops: VIEWS.ops, stream: VIEWS.stream };
["priority", "automation", "account", "live", "evals", "ops", "stream"].forEach(k => delete VIEWS[k]);
const GROUPS = {
  decisions: { title: "Decisions", key: "secD", secs: [["priority", "Prioritization"], ["automation", "Automation"], ["account", "Account trace"]] },
  aisafety: { title: "AI &amp; Safety", key: "secA", secs: [["live", "Try a reply"], ["evals", "Evaluation"]] },
  operations: { title: "Operations", key: "secO", secs: [["ops", "Metrics"], ["stream", "Event stream"]] },
};
const SECOF = {}; for (const [g, v] of Object.entries(GROUPS)) v.secs.forEach(([id]) => { SECOF[id] = g; });
const currentSec = g => { const G = GROUPS[g]; return (G.secs.find(s => s[0] === state[G.key]) || G.secs[0])[0]; };
async function groupView(g) {
  const G = GROUPS[g], cur = currentSec(g);
  const body = (await SEC[cur]()).replace(/<h1>[\s\S]*?<\/h1>/, "");
  return `<h1>${G.title}</h1><div class="seg">${G.secs.map(([id, label]) => `<button data-sec="${id}" class="${id === cur ? "active" : ""}">${label}</button>`).join("")}</div>${body}`;
}
Object.keys(GROUPS).forEach(g => { VIEWS[g] = () => groupView(g); });

// ---------------------------------------------------------------------------------------------------------------
const state = { view: "overview", ...(store.get("orch.ui") || {}) };
function saveUI() { store.set("orch.ui", { flow: state.flow, runFlow: state.runFlow, runTab: state.runTab, lead: state.lead, acc: state.acc, more: state.more, tag: state.tag, sc: state.sc, apFilter: state.apFilter, apTier: state.apTier, apSel: state.apSel, secD: state.secD, secA: state.secA, secO: state.secO }); }
async function show(view, extra = {}) {
  if (SECOF[view]) { extra = { ...extra, [GROUPS[SECOF[view]].key]: view }; view = SECOF[view]; }     // an old tab name opens its section
  Object.assign(state, { view }, extra);
  const sec = GROUPS[view] ? currentSec(view) : null;
  saveUI();
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === view));
  try { $("#main").innerHTML = (CAN_SAVE ? "" : '<div class="banner warn">Your browser is blocking site storage (a private window, perhaps). The page works and keeps your changes while this tab stays open, but they will not survive a reload.</div>') + await VIEWS[view](); } catch (e) { $("#main").innerHTML = `<p class="no">Could not load: ${esc(e.message)}</p>`; return; }
  const k = sec || view;
  if (k === "live") bindLive();
  if (k === "evals") bindEvals();
  if (k === "run") bindRun();
  if (k === "flows" && $("#challengeMap") && state.cm) $("#challengeMap").innerHTML = challengeMapHtml(state.cm);
  if (k === "approvals") bindApprovals();
  if (k === "overview") { bindMonth(); bindOverview(); }
  if (k === "priority") bindPriority();
  if (k === "automation") bindAutomation();
  if (k === "account") bindAccount();
  try { history.replaceState(null, "", "#" + k); } catch {}
  $("#rail").classList.remove("open");
}
$("#nav").onclick = e => { const v = e.target.dataset.v; if (v) show(v); };
$("#main").onclick = e => {
  const f = e.target.closest("[data-flow]"); if (f) return show("flows", { flow: f.dataset.flow, more: Boolean(f.closest("details")) });
  const t = e.target.closest("[data-tag]"); if (t) return show("flows", { tag: t.dataset.tag, sc: null, more: true });
  const sg = e.target.closest("[data-sec]"); if (sg) return show(sg.dataset.sec);
  const gt = e.target.closest("[data-go]"); if (gt) { e.preventDefault(); return show(gt.dataset.go); }
  const r = e.target.closest("[data-sc]"); if (r) { show("flows", { sc: r.dataset.sc, more: true }).then(() => $("#detail").scrollIntoView()); }
};
$("#menu").onclick = () => $("#rail").classList.toggle("open");
$("#resetDemo").onclick = resetDemo;
$("#main").addEventListener("toggle", e => { if (e.target.tagName !== "DETAILS") return; const saved = store.get(DETKEY) || {}; saved[detKey(e.target)] = e.target.open; store.set(DETKEY, saved); }, true);
new MutationObserver(muts => { for (const m of muts) for (const n of m.addedNodes) if (n.nodeType === 1) restoreDetails(n.tagName === "DETAILS" ? n.parentNode : n); })
  .observe($("#main"), { childList: true, subtree: true });
const ALIAS = { flow: "run", scoring: "priority", audience: "account", scenarios: "flows", metrics: "ops" };
const fromHash = () => { const x = location.hash.slice(1); return ALIAS[x] || x; };
const known = v => Object.prototype.hasOwnProperty.call(VIEWS, v) || Object.prototype.hasOwnProperty.call(SECOF, v);
show(known(fromHash()) ? fromHash() : "overview");
window.addEventListener("hashchange", () => {
  const v = fromHash(); if (!known(v)) return;
  const here = SECOF[v] ? state.view === SECOF[v] && currentSec(SECOF[v]) === v : v === state.view;
  if (!here) show(v);
});
</script>
</body>
</html>
